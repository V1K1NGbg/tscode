name: Check and publish

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  shell:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            command -v shellcheck >/dev/null || brew install shellcheck
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck zsh
          fi
      - name: Lint shell scripts
        run: shellcheck -x -P SCRIPTDIR --shell=bash -e SC1090,SC1091 install.sh scripts/* config/bash-env config/packages.sh tests/*.sh
      - name: Regression checks
        run: bash tests/check.sh

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: tscode:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Startup and toolchain smoke tests
        run: bash tests/smoke.sh tscode:test linux/${{ matrix.arch }}

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
    needs: [shell, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            v1k1ngbg/tscode:latest
            v1k1ngbg/tscode:${{ github.sha }}
